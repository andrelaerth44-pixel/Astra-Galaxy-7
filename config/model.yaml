model:
  vocab_size: 32000
  hidden_size: 512
  num_layers: 8
  num_heads: 8
  intermediate_size: 2048
  max_seq_len: 2048
  rope_theta: 10000.0
  dropout: 0.0

training:
  seed: 42
  batch_size: 2
  gradient_accumulation_steps: 16
  learning_rate: 0.0003
  weight_decay: 0.1
  warmup_steps: 200
  max_steps: 10000
  log_every: 10
  save_every: 500
  data_path: data/processed/train.txt
  checkpoint_dir: checkpoints
  precision: bf16
