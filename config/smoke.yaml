model:
  vocab_size: 256
  hidden_size: 128
  num_layers: 4
  num_heads: 4
  intermediate_size: 512
  max_seq_len: 128
  rope_theta: 10000.0
  dropout: 0.0

training:
  seed: 42
  batch_size: 2
  gradient_accumulation_steps: 2
  learning_rate: 0.0003
  weight_decay: 0.1
  warmup_steps: 10
  max_optimizer_steps: 100
  log_every: 10
  save_every: 50
  eval_every: 25
  eval_batches: 10
  data_path: data/processed/train.bin
  validation_data_path: data/processed/validation.bin
  checkpoint_dir: checkpoints/smoke
  precision: bf16
